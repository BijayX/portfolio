<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#09090b;color:#fafafa;font-family:Inter,-apple-system,"Helvetica Neue",Arial,sans-serif;
    display:flex;flex-direction:column;justify-content:center;padding:0 96px;box-sizing:border-box;
    background-image:radial-gradient(circle at 85% 15%,#27272a 0,transparent 45%)}
  .pill{display:inline-flex;align-items:center;gap:12px;background:#18181b;border:1px solid #27272a;color:#d4d4d8;

  .dot{width:14px;height:14px;border-radius:50%;background:#22c55e}
  h1{font-size:84px;line-height:1.05;margin:0 0 24px;letter-spacing:-2px;font-weight:800}
  p{font-size:36px;color:#a1a1aa;margin:0;line-height:1.35;max-width:950px}
  .url{position:absolute;bottom:56px;left:96px;font-size:28px;color:#71717a}
</style></head>
<body>
  <div class="pill"><span class="dot"></span>Available for freelance work</div>
  <h1>Bijay Kumar Shrestha</h1>
  <p>Laravel &amp; React developer · web apps, mobile backends &amp; payment integrations</p>
  <div class="url">bijayastha.com.np</div>
</body></html>
